<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sea Battle • Tactical ImGui Mobile</title>
<script src="https://unpkg.com/mqtt@5.10.4/dist/mqtt.min.js"></script>
<style>
:root {
  --bg: #0b0e14;
  --surface: #151821;
  --surface-hover: #1c212d;
  --border: #232838;
  --border-active: #ffffff;
  --text-main: #f8fafc;
  --text-muted: #8a95a5;
  --text-dim: #555e6d;
  --cell-bg: #12151e;
  --cell-border: #1f2535;
  --cell-ship: #252e3e;
  --cell-ship-border: #3b465c;
  --cell-miss-dot: #64748b;
  --cell-hit-bg: #3a181c;
  --cell-hit-border: #7f1d1d;
  --cell-hit-cross: #f87171;
  --cell-sunk-bg: #4a141a;
  --cell-sunk-border: #dc2626;
  --green: #22c55e;
  --red: #ef4444;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}

body {
  margin: 0;
  padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--text-main);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
}

header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 50;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-icon {
  width: 28px;
  height: 28px;
  color: #ffffff;
  flex-shrink: 0;
}

.brand-title {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.5px;
  line-height: 1.2;
}

.brand-sub {
  font-size: 10px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.room-chip {
  background: #1c212d;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 4px 10px;
  font-size: 12px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 6px;
  letter-spacing: 0.5px;
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--text-dim);
}

.status-dot.online {
  background: var(--green);
  box-shadow: 0 0 8px rgba(34, 197, 94, 0.6);
}

.status-dot.connecting {
  background: #eab308;
}

main {
  flex: 1;
  max-width: 520px;
  width: 100%;
  margin: 0 auto;
  padding: 12px 14px 24px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px;
}

.card-title {
  font-size: 14px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
  color: var(--text-main);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.card-desc {
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 12px;
  line-height: 1.4;
}

/* Кнопки */
button {
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--surface-hover);
  color: var(--text-main);
  padding: 9px 12px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: all 0.15s ease;
  touch-action: manipulation;
}

button:active {
  transform: scale(0.97);
}

button.primary {
  background: #ffffff;
  color: #0b0e14;
  border-color: #ffffff;
}

button.primary:disabled {
  background: #232838;
  color: #555e6d;
  border-color: #232838;
  cursor: not-allowed;
  transform: none;
}

button.danger {
  background: #231417;
  border-color: #4a1d24;
  color: #f87171;
}

.btn-group {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

/* Экран входа в комнату */
.input-room {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text-main);
  font-size: 18px;
  font-weight: 700;
  text-align: center;
  letter-spacing: 4px;
  padding: 12px;
  text-transform: uppercase;
  margin-bottom: 12px;
}

.input-room:focus {
  outline: none;
  border-color: #ffffff;
}

/* Карточки кораблей */
.ship-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 12px;
}

.ship-item {
  background: #11141d;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 9px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  transition: all 0.15s ease;
}

.ship-item.active {
  border-color: #ffffff;
  background: #191d29;
}

.ship-item-info {
  display: flex;
  align-items: center;
  gap: 8px;
}

.ship-item-icon {
  width: 18px;
  height: 18px;
  color: var(--text-muted);
}

.ship-item.active .ship-item-icon {
  color: #ffffff;
}

.ship-item-name {
  font-size: 13px;
  font-weight: 600;
}

.ship-item-indicators {
  display: flex;
  gap: 5px;
}

.deck-sq {
  width: 12px;
  height: 12px;
  border-radius: 2px;
}

.deck-sq.green {
  background: var(--green);
}

.deck-sq.red {
  background: var(--red);
}

/* Сетка игрового поля */
.board-wrap {
  width: 100%;
  max-width: 420px;
  margin: 0 auto;
}

.board-grid {
  display: grid;
  grid-template-columns: 24px repeat(10, 1fr);
  grid-template-rows: 24px repeat(10, 1fr);
  gap: 2px;
  background: #181d28;
  padding: 4px;
  border-radius: 8px;
  border: 1px solid var(--border);
}

.coord-label {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-dim);
}

.cell {
  aspect-ratio: 1;
  background: var(--cell-bg);
  border: 1px solid var(--cell-border);
  border-radius: 3px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  touch-action: manipulation;
  transition: background 0.1s ease;
  position: relative;
}

.cell.ship {
  background: var(--cell-ship);
  border-color: var(--cell-ship-border);
}

.cell.ship-part {
  background: #323d52;
  border-color: #556685;
}

.cell.miss {
  background: #141822;
}

.cell.miss::after {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--cell-miss-dot);
}

.cell.hit {
  background: var(--cell-hit-bg);
  border-color: var(--cell-hit-border);
  color: var(--cell-hit-cross);
}

.cell.sunk {
  background: var(--cell-sunk-bg);
  border-color: var(--cell-sunk-border);
  color: #ffffff;
}

/* Экран боя */
.turn-banner {
  background: #191d29;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 13px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.turn-banner.my-turn {
  background: #ffffff;
  color: #0b0e14;
  border-color: #ffffff;
}

.turn-banner.enemy-turn {
  background: #191d29;
  color: var(--text-muted);
}

.board-tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 8px;
}

.board-tab-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
}

.board-tab-btn.active {
  background: #ffffff;
  color: #0b0e14;
  border-color: #ffffff;
}

/* Всплывающее уведомление */
#toast {
  position: fixed;
  top: 60px;
  left: 50%;
  transform: translateX(-50%) translateY(-20px);
  background: #ffffff;
  color: #0b0e14;
  padding: 9px 18px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 600;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  opacity: 0;
  pointer-events: none;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  z-index: 1000;
  max-width: 90%;
  text-align: center;
}

#toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* Модальное окно окончания игры */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(11, 14, 20, 0.85);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 2000;
}

.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
  width: 100%;
  max-width: 360px;
  text-align: center;
  box-shadow: 0 20px 40px rgba(0,0,0,0.6);
}

.modal-title {
  font-size: 20px;
  font-weight: 800;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
}

.modal-title.win {
  color: #ffffff;
}

.modal-title.loss {
  color: var(--red);
}

.modal-msg {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 20px;
  line-height: 1.5;
}

.hidden {
  display: none !important;
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 17.5L3 12L12 9L21 12L20 17.5M5 11.3333V7C5 5.89543 5.89543 5 7 5H17C18.1046 5 19 5.89543 19 7V11.3333M10 5V3C10 2.44772 10.4477 2 11 2H13C13.5523 2 14 2.44772 14 3V5M2 21C3 22 6 22 8 20C10 22 14 22 16 20C18 22 21 22 22 21"/>
    </svg>
    <div>
      <div class="brand-title">SEA BATTLE</div>
      <div class="brand-sub">TACTICAL EDITION</div>
    </div>
  </div>

  <div class="room-chip">
    <div id="statusDot" class="status-dot"></div>
    <span id="roomCodeDisplay">КОМНАТА: —</span>
  </div>
</header>

<main>
  <!-- Экран 1: Вход в комнату -->
  <section id="screenJoin" class="card">
    <div class="card-title">Подключение к матчу</div>
    <div class="card-desc">Введите 5-значный код комнаты, отображаемый на экране ПК</div>
    <input id="inputRoomCode" class="input-room" maxlength="5" placeholder="КОД">
    <button id="btnConnect" class="primary" style="width: 100%; padding: 13px;">Подключиться</button>
  </section>

  <!-- Экран 2: Расстановка флота -->
  <section id="screenPlacement" class="card hidden">
    <div class="card-title">
      <span>Расстановка флота</span>
      <span id="placementCount" style="font-size: 11px; color: var(--text-muted); font-weight: 500;">0/10</span>
    </div>
    <div class="card-desc">Выберите корабль и клетку. Повторный клик убирает корабль.</div>

    <!-- Выбор корабля -->
    <div class="ship-list" id="shipSelector">
      <!-- Генерируется динамически -->
    </div>

    <!-- Кнопки управления расстановкой -->
    <div class="btn-group" style="margin-bottom: 12px;">
      <button id="btnRotate">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.85.83 6.72 2.24L21 8"/><polyline points="21 3 21 8 16 8"/></svg>
        <span id="rotateLabel">Гор.</span>
      </button>
      <button id="btnAuto">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
        <span>Авто</span>
      </button>
    </div>

    <!-- Сетка расстановки -->
    <div class="board-wrap">
      <div id="gridPlacement" class="board-grid"></div>
    </div>

    <div style="display: flex; gap: 8px; margin-top: 12px;">
      <button id="btnClear" class="danger" style="flex: 1;">Очистить</button>
      <button id="btnReady" class="primary" style="flex: 2;" disabled>Готов к бою</button>
    </div>
  </section>

  <!-- Экран 3: Бой -->
  <section id="screenBattle" class="card hidden">
    <div id="turnBanner" class="turn-banner enemy-turn" style="margin-bottom: 12px;">
      <span id="turnText">Ожидание начала боя...</span>
      <span id="fleetCounters" style="font-size: 11px; opacity: 0.8;">10 vs 10</span>
    </div>

    <!-- Вкладки полей -->
    <div class="board-tabs">
      <button id="tabEnemy" class="board-tab-btn active">Поле противника (ПК)</button>
      <button id="tabOwn" class="board-tab-btn">Ваш флот</button>
    </div>

    <!-- Поле противника -->
    <div id="enemyBoardView" class="board-wrap">
      <div id="gridEnemy" class="board-grid"></div>
    </div>

    <!-- Собственное поле -->
    <div id="ownBoardView" class="board-wrap hidden">
      <div id="gridOwnBattle" class="board-grid"></div>
    </div>
  </section>
</main>

<div id="toast"></div>

<!-- Модальное окно результатов -->
<div id="modalOverlay" class="modal-overlay hidden">
  <div class="modal">
    <div id="modalTitle" class="modal-title">ИТОГИ МАТЧА</div>
    <div id="modalMsg" class="modal-msg">—</div>
    <button class="primary" style="width: 100%; padding: 12px;" onclick="resetForNewGame()">Сыграть снова</button>
  </div>
</div>

<script>
const LETTERS = ['А', 'Б', 'В', 'Г', 'Д', 'Е', 'Ж', 'З', 'И', 'К'];
const SIZE = 10;
const FLEET_CONFIG = {4: 1, 3: 2, 2: 3, 1: 4};
const SHIP_NAMES = {4: 'Линкор', 3: 'Крейсер', 2: 'Эсминец', 1: 'Катер'};

let currentRoom = '';
let client = null;
let currentOrientation = 'H';
let selectedSize = 4;
let ships = [];
let ownGridData = Array(100).fill(0); // 0: empty, 1: ship, 2: miss, 3: hit, 4: sunk
let enemyGridData = Array(100).fill(0);
let myTurn = false;
let gameOver = false;
let enemySunkCount = 0;

function updateFleetCounters() {
  const ownAlive = ships.filter(sh => !sh.cells.every(([cr, cc]) => ownGridData[cr * SIZE + cc] === 4)).length;
  const enemyAlive = Math.max(0, 10 - enemySunkCount);
  const el = document.getElementById('fleetCounters');
  if (el) el.textContent = `${ownAlive} vs ${enemyAlive}`;
}

function resetForNewGame() {
  document.getElementById('modalOverlay').classList.add('hidden');
  document.getElementById('screenBattle').classList.add('hidden');
  document.getElementById('screenPlacement').classList.remove('hidden');
  ownGridData.fill(0);
  enemyGridData.fill(0);
  ships = [];
  myTurn = false;
  gameOver = false;
  enemySunkCount = 0;
  updatePlacementView();
  updateFleetCounters();
  sendMessage({action: 'restart'});
  showToast('Расставьте флот для новой игры');
}

// URL параметры
const urlParams = new URLSearchParams(window.location.search);
const roomFromUrl = (urlParams.get('room') || '').trim().toUpperCase();

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
  if (navigator.vibrate) {
    try { navigator.vibrate(30); } catch(e){}
  }
}

// Построение DOM сетки с координатами А..К и 1..10
function buildGridDOM(container, cellData, onCellClick) {
  container.innerHTML = '';
  // Угловая клетка
  const corner = document.createElement('div');
  corner.className = 'coord-label';
  container.appendChild(corner);

  // Буквы А..К
  for (let c = 0; c < SIZE; c++) {
    const lbl = document.createElement('div');
    lbl.className = 'coord-label';
    lbl.textContent = LETTERS[c];
    container.appendChild(lbl);
  }

  // Строки
  for (let r = 0; r < SIZE; r++) {
    const numLbl = document.createElement('div');
    numLbl.className = 'coord-label';
    numLbl.textContent = r + 1;
    container.appendChild(numLbl);

    for (let c = 0; c < SIZE; c++) {
      const idx = r * SIZE + c;
      const val = cellData[idx];
      const cell = document.createElement('div');
      cell.className = 'cell';

      if (val === 1) cell.classList.add('ship');
      else if (val === 2) cell.classList.add('miss');
      else if (val === 3) {
        cell.classList.add('hit');
        cell.textContent = '✕';
      }
      else if (val === 4) {
        cell.classList.add('sunk');
        cell.textContent = '✕';
      }

      if (onCellClick) {
        cell.onclick = (e) => {
          e.preventDefault();
          onCellClick(r, c);
        };
      }
      container.appendChild(cell);
    }
  }
}

// Карточки выбора кораблей
function updateShipSelectorUI() {
  const container = document.getElementById('shipSelector');
  container.innerHTML = '';

  const remaining = getRemainingShips();
  let totalShipsPlaced = ships.length;
  document.getElementById('placementCount').textContent = `${totalShipsPlaced}/10`;

  [4, 3, 2, 1].forEach(size => {
    const total = FLEET_CONFIG[size];
    const rem = remaining[size];
    const placed = total - rem;
    const isActive = (size === selectedSize);

    const item = document.createElement('div');
    item.className = 'ship-item' + (isActive ? ' active' : '');
    item.onclick = () => {
      selectedSize = size;
      updateShipSelectorUI();
    };

    const left = document.createElement('div');
    left.className = 'ship-item-info';
    left.innerHTML = `
      <svg class="ship-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 17.5L3 12L12 9L21 12L20 17.5M5 11.3333V7C5 5.89543 5.89543 5 7 5H17C18.1046 5 19 5.89543 19 7V11.3333M10 5V3C10 2.44772 10.4477 2 11 2H13C13.5523 2 14 2.44772 14 3V5M2 21C3 22 6 22 8 20C10 22 14 22 16 20C18 22 21 22 22 21"/>
      </svg>
      <span class="ship-item-name">${SHIP_NAMES[size]} (${size})</span>
    `;

    const right = document.createElement('div');
    right.className = 'ship-item-indicators';
    for (let i = 0; i < total; i++) {
      const sq = document.createElement('div');
      sq.className = 'deck-sq ' + (i < placed ? 'red' : 'green');
      right.appendChild(sq);
    }

    item.appendChild(left);
    item.appendChild(right);
    container.appendChild(item);
  });

  const btnReady = document.getElementById('btnReady');
  if (totalShipsPlaced === 10) {
    btnReady.disabled = false;
    btnReady.textContent = 'Готов к бою ✓';
  } else {
    btnReady.disabled = true;
    btnReady.textContent = `Расставьте корабли (${totalShipsPlaced}/10)`;
  }
}

function getRemainingShips() {
  const rem = {...FLEET_CONFIG};
  ships.forEach(s => {
    if (rem[s.size] > 0) rem[s.size]--;
  });
  return rem;
}

function getShipCells(r, c, size, orientation) {
  const res = [];
  for (let i = 0; i < size; i++) {
    res.push([r + (orientation === 'V' ? i : 0), c + (orientation === 'H' ? i : 0)]);
  }
  return res;
}

function canPlaceShip(cells) {
  return cells.every(([r, c]) => {
    if (r < 0 || r >= SIZE || c < 0 || c >= SIZE) return false;
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        const nr = r + dr;
        const nc = c + dc;
        if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE) {
          if (ownGridData[nr * SIZE + nc] === 1) return false;
        }
      }
    }
    return true;
  });
}

function onPlacementCellClick(r, c) {
  const idx = r * SIZE + c;
  if (ownGridData[idx] === 1) {
    const existing = ships.find(s => s.cells.some(([cr, cc]) => cr === r && cc === c));
    if (existing) {
      existing.cells.forEach(([cr, cc]) => ownGridData[cr * SIZE + cc] = 0);
      ships = ships.filter(s => s !== existing);
      showToast('Корабль убран');
      updatePlacementView();
      return;
    }
  }

  const remaining = getRemainingShips();
  if (remaining[selectedSize] <= 0) {
    showToast(`Все корабли типа «${SHIP_NAMES[selectedSize]}» уже выставлены`);
    return;
  }

  const cells = getShipCells(r, c, selectedSize, currentOrientation);
  if (!canPlaceShip(cells)) {
    showToast('Нельзя поставить: касание или выход за пределы');
    return;
  }

  cells.forEach(([cr, cc]) => ownGridData[cr * SIZE + cc] = 1);
  ships.push({size: selectedSize, cells});
  updatePlacementView();
}

function updatePlacementView() {
  buildGridDOM(document.getElementById('gridPlacement'), ownGridData, onPlacementCellClick);
  updateShipSelectorUI();
}

function clearPlacement() {
  ownGridData.fill(0);
  ships = [];
  updatePlacementView();
  showToast('Поле очищено');
}

function autoPlaceFleet() {
  const fleetOrder = [4, 3, 3, 2, 2, 2, 1, 1, 1, 1];
  for (let attempt = 0; attempt < 100; attempt++) {
    ownGridData.fill(0);
    ships = [];
    let ok = true;
    for (const size of fleetOrder) {
      let placed = false;
      for (let tries = 0; tries < 200; tries++) {
        const orient = Math.random() < 0.5 ? 'H' : 'V';
        const r = Math.floor(Math.random() * SIZE);
        const c = Math.floor(Math.random() * SIZE);
        const cells = getShipCells(r, c, size, orient);
        if (canPlaceShip(cells)) {
          cells.forEach(([cr, cc]) => ownGridData[cr * SIZE + cc] = 1);
          ships.push({size, cells});
          placed = true;
          break;
        }
      }
      if (!placed) { ok = false; break; }
    }
    if (ok) break;
  }
  updatePlacementView();
  showToast('Случайная расстановка готова');
}

// Сетевое подключение MQTT с автопереключением брокера
function connectToRoom(roomCode) {
  currentRoom = roomCode.trim().toUpperCase();
  if (!currentRoom) return showToast('Введите код комнаты');

  document.getElementById('roomCodeDisplay').textContent = `КОМНАТА: ${currentRoom}`;
  const dot = document.getElementById('statusDot');
  dot.className = 'status-dot connecting';

  const brokers = [
    'wss://broker.hivemq.com:8884/mqtt',
    'wss://broker.emqx.io:8084/mqtt'
  ];
  let brokerIdx = 0;

  function tryConnect() {
    const brokerUrl = brokers[brokerIdx];
    client = mqtt.connect(brokerUrl, {
      clientId: 'sea_mob_' + Math.random().toString(36).substring(2, 10),
      clean: true,
      reconnectPeriod: 3000,
      connectTimeout: 4000
    });

    client.on('connect', () => {
      dot.className = 'status-dot online';
      client.subscribe(`seabattle/rooms/${currentRoom}/phone`);
      sendMessage({action: 'phone_join'});
      showToast('Подключено к брокеру');

      document.getElementById('screenJoin').classList.add('hidden');
      document.getElementById('screenPlacement').classList.remove('hidden');
      updatePlacementView();
    });

    client.on('message', (_, buf) => {
      try {
        const msg = JSON.parse(buf.toString());
        handleServerMessage(msg);
      } catch(e) {}
    });

    client.on('error', () => {
      if (brokerIdx < brokers.length - 1) {
        brokerIdx++;
        try { client.end(true); } catch(e){}
        setTimeout(tryConnect, 500);
      }
    });

    client.on('offline', () => {
      dot.className = 'status-dot connecting';
    });
  }

  tryConnect();
}

function sendMessage(data) {
  if (client && client.connected) {
    client.publish(`seabattle/rooms/${currentRoom}/pc`, JSON.stringify(data), {qos: 1});
  }
}

function onReadyClick() {
  if (ships.length !== 10) return showToast('Расставьте все 10 кораблей!');
  sendMessage({action: 'ready', size: SIZE});
  document.getElementById('screenPlacement').classList.add('hidden');
  document.getElementById('screenBattle').classList.remove('hidden');

  buildGridDOM(document.getElementById('gridEnemy'), enemyGridData, shootEnemyCell);
  buildGridDOM(document.getElementById('gridOwnBattle'), ownGridData, null);

  setTurnState(false, 'Ожидание хода с ПК...');
  showToast('Вы готовы! Ожидание ПК...');
}

function shootEnemyCell(r, c) {
  if (!myTurn || gameOver) return;
  const idx = r * SIZE + c;
  if (enemyGridData[idx] !== 0) return; // Уже стреляли

  myTurn = false;
  setTurnState(false, 'Выстрел отправлен...');
  sendMessage({action: 'shot', r, c});
}

function setTurnState(isMine, label) {
  myTurn = isMine;
  const banner = document.getElementById('turnBanner');
  const txt = document.getElementById('turnText');

  if (isMine) {
    banner.className = 'turn-banner my-turn';
    txt.textContent = label || 'ВАШ ХОД — Стреляйте!';
  } else {
    banner.className = 'turn-banner enemy-turn';
    txt.textContent = label || 'ХОД ПРОТИВНИКА (ПК)...';
  }
}

function getSurroundingCells(shipCells) {
  const set = new Set();
  const res = [];
  shipCells.forEach(([sr, sc]) => {
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        const nr = sr + dr;
        const nc = sc + dc;
        if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE) {
          if (!shipCells.some(([a, b]) => a === nr && b === nc)) {
            const key = `${nr},${nc}`;
            if (!set.has(key)) {
              set.add(key);
              res.push([nr, nc]);
            }
          }
        }
      }
    }
  });
  return res;
}

function showResultModal(isWin, title, msg) {
  gameOver = true;
  const overlay = document.getElementById('modalOverlay');
  const t = document.getElementById('modalTitle');
  t.className = 'modal-title ' + (isWin ? 'win' : 'loss');
  t.textContent = title;
  document.getElementById('modalMsg').textContent = msg;
  overlay.classList.remove('hidden');
}

function handleServerMessage(m) {
  if (m.action === 'join_accepted') {
    showToast('Соединение с ПК установлено');
  }

  if (m.action === 'game_start') {
    myTurn = !!m.phone_turn;
    setTurnState(myTurn, myTurn ? 'ВАШ ХОД — Стреляйте!' : 'Ход противника на ПК');
    showToast('Бой начался!');
  }

  if (m.action === 'shot_result') {
    const idx = m.r * SIZE + m.c;
    enemyGridData[idx] = (m.res === 'miss' ? 2 : m.res === 'hit' ? 3 : 4);
    if (m.surrounding) {
      m.surrounding.forEach(([sr, sc]) => {
        enemyGridData[sr * SIZE + sc] = 2;
      });
    }

    myTurn = (m.res !== 'miss');
    buildGridDOM(document.getElementById('gridEnemy'), enemyGridData, shootEnemyCell);
    setTurnState(myTurn, myTurn ? 'ВАШ ХОД (Попадание!)' : 'Ход противника на ПК');

    if (m.res === 'miss') showToast(`Промах (${LETTERS[m.c]}${m.r + 1})`);
    else if (m.res === 'hit') showToast(`Попадание! (${LETTERS[m.c]}${m.r + 1})`);
    else if (m.res === 'sunk') {
      enemySunkCount++;
      showToast(`Корабль противника потоплен!`);
    }
    updateFleetCounters();

    if (m.all_sunk) {
      showResultModal(true, 'ПОБЕДА!', 'Вы потопили весь флот противника на ПК!');
    }
  }

  if (m.action === 'incoming_shot') {
    const idx = m.r * SIZE + m.c;
    let res = 'miss';
    let surrounding = [];

    if (ownGridData[idx] === 1) {
      ownGridData[idx] = 3; // hit
      const s = ships.find(sh => sh.cells.some(([cr, cc]) => cr === m.r && cc === m.c));
      if (s && s.cells.every(([cr, cc]) => ownGridData[cr * SIZE + cc] === 3)) {
        res = 'sunk';
        s.cells.forEach(([cr, cc]) => ownGridData[cr * SIZE + cc] = 4);
        surrounding = getSurroundingCells(s.cells);
      } else {
        res = 'hit';
      }
    } else if (ownGridData[idx] === 0) {
      ownGridData[idx] = 2; // miss
    }

    const allSunk = ships.every(sh => sh.cells.every(([cr, cc]) => ownGridData[cr * SIZE + cc] === 4));
    sendMessage({action: 'defense_result', r: m.r, c: m.c, res, surrounding, all_sunk: allSunk});
    buildGridDOM(document.getElementById('gridOwnBattle'), ownGridData, null);
    updateFleetCounters();

    myTurn = (res === 'miss');
    setTurnState(myTurn, myTurn ? 'ВАШ ХОД — Стреляйте!' : 'Ход противника на ПК');

    if (allSunk) {
      showResultModal(false, 'ПОРАЖЕНИЕ!', 'Ваш флот был уничтожен игроком на ПК.');
    }
  }

  if (m.action === 'game_over') {
    if (m.winner === 'phone') {
      showResultModal(true, 'ПОБЕДА!', 'Вы победили! Флот противника уничтожен.');
    } else {
      showResultModal(false, 'ПОРАЖЕНИЕ!', 'Игрок на ПК уничтожил ваш флот.');
    }
  }
}

// Привязка кнопок
document.getElementById('btnConnect').onclick = () => {
  const code = document.getElementById('inputRoomCode').value;
  connectToRoom(code);
};

document.getElementById('btnRotate').onclick = () => {
  currentOrientation = (currentOrientation === 'H' ? 'V' : 'H');
  document.getElementById('rotateLabel').textContent = (currentOrientation === 'H' ? 'Гор.' : 'Верт.');
};

document.getElementById('btnAuto').onclick = autoPlaceFleet;
document.getElementById('btnClear').onclick = clearPlacement;
document.getElementById('btnReady').onclick = onReadyClick;

document.getElementById('tabEnemy').onclick = () => {
  document.getElementById('tabEnemy').classList.add('active');
  document.getElementById('tabOwn').classList.remove('active');
  document.getElementById('enemyBoardView').classList.remove('hidden');
  document.getElementById('ownBoardView').classList.add('hidden');
};

document.getElementById('tabOwn').onclick = () => {
  document.getElementById('tabOwn').classList.add('active');
  document.getElementById('tabEnemy').classList.remove('active');
  document.getElementById('ownBoardView').classList.remove('hidden');
  document.getElementById('enemyBoardView').classList.add('hidden');
};

// Авто-вход, если перешли по ссылке из QR-кода
if (roomFromUrl) {
  document.getElementById('inputRoomCode').value = roomFromUrl;
  connectToRoom(roomFromUrl);
}
