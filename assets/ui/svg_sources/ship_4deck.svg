  <line x1="7" y1="24" x2="17" y2="24" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="1.5 1.5" stroke-linecap="round"/>
  <line x1="7" y1="48" x2="17" y2="48" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="1.5 1.5" stroke-linecap="round"/>
  <line x1="7" y1="72" x2="17" y2="72" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="1.5 1.5" stroke-linecap="round"/>
  <!-- Палуба 1: Нос и башня А -->
  <line x1="12" y1="5" x2="12" y2="8" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="12" cy="11.5" r="2.8" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
  <circle cx="12" cy="11.5" r="1" fill="#FFFFFF"/>
  <line x1="12" y1="16" x2="12" y2="19" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Палуба 2: Башня B и носовая надстройка -->
  <circle cx="12" cy="22.5" r="2.8" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
  <circle cx="12" cy="22.5" r="1" fill="#FFFFFF"/>
  <path d="M 8.5 32 C 9.8 30.5 14.2 30.5 15.5 32 L 15.5 42 C 15.5 42.6 15 43 14.5 43 L 9.5 43 C 9 43 8.5 42.6 8.5 42 Z" 
        fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linejoin="round"/>
  <rect x="10" y="34" width="4" height="2" rx="0.5" fill="#FFFFFF"/>
  <!-- Палуба 3: Трубы, спасательные шлюпки / башни ПВО -->
  <rect x="9.5" y="52" width="5" height="3" rx="0.8" fill="#FFFFFF"/>
  <rect x="9.5" y="59" width="5" height="3" rx="0.8" fill="#FFFFFF"/>
  <circle cx="7.5" cy="55.5" r="1" fill="#FFFFFF"/>
  <circle cx="16.5" cy="55.5" r="1" fill="#FFFFFF"/>
  <rect x="10" y="65" width="4" height="3" rx="0.6" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
  <!-- Палуба 4: Кормовые башни и корма -->
  <circle cx="12" cy="78" r="2.8" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
  <circle cx="12" cy="78" r="1" fill="#FFFFFF"/>
  <line x1="12" y1="81" x2="12" y2="84" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="12" cy="88" r="1.5" fill="#FFFFFF"/>
