  <path d="M 12 2 C 14.5 5 18 12 18 22 L 18 91.5 C 18 93 16.9 94 15.5 94 L 8.5 94 C 7.1 94 6 93 6 91.5 L 6 22 C 6 12 9.5 5 12 2 Z" 
        fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
