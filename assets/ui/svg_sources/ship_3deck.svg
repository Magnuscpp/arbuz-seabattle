  <path d="M 12 2 C 14.5 5 18 10 18 18 L 18 67.5 C 18 69 16.9 70 15.5 70 L 8.5 70 C 7.1 70 6 69 6 67.5 L 6 18 C 6 10 9.5 5 12 2 Z" 
        fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Разделители палуб -->
  <line x1="7" y1="24" x2="17" y2="24" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="1.5 1.5" stroke-linecap="round"/>
  <line x1="7" y1="48" x2="17" y2="48" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="1.5 1.5" stroke-linecap="round"/>
  <!-- Палуба 1 (Носовая): Орудие 1 -->
  <line x1="12" y1="5.5" x2="12" y2="8.5" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="12" cy="11.5" r="2.5" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
  <circle cx="12" cy="11.5" r="0.9" fill="#FFFFFF"/>
  <rect x="10" y="16.5" width="4" height="2.5" rx="0.5" fill="#FFFFFF"/>
  <!-- Палуба 2 (Центральная): Командный мостик и труба -->
  <path d="M 8.5 28.5 C 9.8 27.5 14.2 27.5 15.5 28.5 L 15.5 37 C 15.5 37.6 15 38 14.5 38 L 9.5 38 C 9 38 8.5 37.6 8.5 37 Z" 
        fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linejoin="round"/>
  <rect x="9.5" y="40.5" width="5" height="3" rx="0.8" fill="#FFFFFF"/>
  <!-- Палуба 3 (Кормовая): Вторая труба и кормовое орудие -->
  <rect x="10" y="52" width="4" height="2.5" rx="0.6" fill="#FFFFFF"/>
  <circle cx="12" cy="59.5" r="2.5" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
  <circle cx="12" cy="59.5" r="0.9" fill="#FFFFFF"/>
  <line x1="12" y1="62.5" x2="12" y2="65.5" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
</svg>